name: APK உருவாக்கு

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build debug APK
        run: |
          # zip கோப்பாக upload செய்திருந்தால் பிரித்தெடுக்கும்
          for z in *.zip; do [ -f "$z" ] && unzip -o -q "$z"; done || true
          # settings.gradle எந்த folder-ல் இருந்தாலும் கண்டுபிடிக்கும்
          F=$(find . -name settings.gradle -not -path './.git/*' | head -1)
          if [ -z "$F" ]; then echo "settings.gradle கிடைக்கவில்லை"; ls -R | head -50; exit 1; fi
          DIR=$(dirname "$F")
          echo "Project folder: $DIR"
          cd "$DIR"
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: karumbu-kanakku-apk
          path: '**/build/outputs/apk/debug/app-debug.apk'
